name: DS watch

# Three ways to wake up:
#   schedule  — scheduled polling, the default mode and a safety net for missed events
#   dispatch  — manually from the Actions tab
#   repository_dispatch — a LIBRARY_PUBLISH event delivered by the Figma relay
on:
  schedule:
    - cron: '0 6 * * 1-5'      # weekdays, 06:00 UTC — before the workday starts
  workflow_dispatch:
    inputs:
      fail-on:
        description: 'Failure threshold: new | high | medium | low | never'
        default: 'new'
      accept-baseline:
        description: 'Accept the current state as the baseline'
        type: boolean
        default: false
  repository_dispatch:
    types: [figma-library-publish]

permissions:
  contents: read
  security-events: write        # for the SARIF upload to code scanning
  issues: write                 # for reporting into an issue

concurrency:
  group: ds-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config from secret
        env:
          NW_CONFIG: ${{ secrets.NW_CONFIG }}
        run: |
          if [ -f config.json ]; then
            echo "config from the repository"
          elif [ -n "$NW_CONFIG" ]; then
            printf '%s' "$NW_CONFIG" > config.json
            echo "config from the NW_CONFIG secret"
          else
            echo "::error::Neither config.json in the repo nor the NW_CONFIG secret"
            exit 1
          fi
          python3 -c "import json;json.load(open('config.json'));print('config.json accepted')"

      - name: Queue the Figma event
        if: github.event_name == 'repository_dispatch'
        run: |
          printf '%s' '${{ toJSON(github.event.client_payload) }}' > /tmp/event.json
          python3 bin/watch.py --event /tmp/event.json
          python3 bin/watch.py --drain

      - name: Poll the design system
        if: github.event_name != 'repository_dispatch'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: python3 bin/watch.py

      - name: Decide whether to wake the bot
        id: trigger
        run: |
          CHANGED=$(python3 -c "import json;print(json.load(open('snapshots/trigger.json'))['changed'])")
          NEEDS=$(python3 -c "import json;print(json.load(open('snapshots/trigger.json'))['needsVariableRefresh'])")
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "needs_vars=$NEEDS"  >> $GITHUB_OUTPUT
          python3 -c "
          import json
          t = json.load(open('snapshots/trigger.json'))
          print('Source:', t['source'])
          print('Changes:', '; '.join(t['reasons']))
          "

      - name: DS snapshot from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            snapshots/ds-latest.json
            snapshots/ds-remote-state.json
          key: ds-snapshot-${{ hashFiles('config.json') }}
          restore-keys: ds-snapshot-

      # Variable values cannot be fetched from CI: the Variables REST API is
      # Enterprise-only. If a publish touched variables, the snapshot is marked
      # stale and the report says so honestly instead of comparing to stale data.
      - name: Mark snapshot stale if variables moved
        if: steps.trigger.outputs.needs_vars == 'True'
        run: |
          python3 - <<'PY'
          import json, os
          p = 'snapshots/ds-latest.json'
          if os.path.exists(p):
              d = json.load(open(p, encoding='utf-8'))
              d['variablesComplete'] = False
              d['variablesNote'] = ('A library publish touched variables, and their values '
                                    'cannot be fetched from CI — the Variables REST API is '
                                    'Enterprise-only. Snapshot marked stale: an agent run '
                                    'with Figma MCP is required.')
              json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
              print('snapshot marked stale')
          PY

      - name: Compare
        id: diff
        continue-on-error: true
        run: |
          python3 bin/nw.py --fail-on "${{ inputs.fail-on || 'new' }}" --sarif nw.sarif

      - name: Findings to code scanning
        if: always() && hashFiles('nw.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: nw.sarif
          category: ds-helper

      - name: Report into the run summary
        if: always()
        run: |
          {
            echo "## Night Watch — design-system check"
            echo
            if [ ! -f reports/REPORT.md ]; then
              echo "_The run crashed before a report was produced — see the failed step above._"
              exit 0
            fi
            sed -n '1,60p' reports/REPORT.md
            echo
            echo "<details><summary>Full report</summary>"
            echo
            cat reports/REPORT.md
            echo
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-report
          path: |
            reports/
            snapshots/findings.json
            snapshots/trigger.json
          retention-days: 30

      - name: Accept the baseline
        if: inputs.accept-baseline
        run: |
          python3 bin/nw.py --accept
          echo "Baseline updated. Commit snapshots/baseline.json." >> $GITHUB_STEP_SUMMARY

      - name: Save snapshot to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            snapshots/ds-latest.json
            snapshots/ds-remote-state.json
          key: ds-snapshot-${{ hashFiles('config.json') }}-${{ github.run_id }}

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.diff.outcome }}" = "failure" ]; then
            echo "::warning::New design-system drift — see Security → Code scanning"
            exit 1
          fi
          echo "No new drift"

name: Prototypes check

# Checks the mockups living in this very repository.
# Runs on every push and PR that touches them — unlike ds-watch,
# which watches Figma on a schedule.
on:
  push:
    branches: [main]
    paths: ['prototypes/**', 'bin/**', 'config.json', 'snapshots/ds-latest.json']
  pull_request:
    paths: ['prototypes/**', 'bin/**', 'config.json', 'snapshots/ds-latest.json']
  workflow_dispatch:
    inputs:
      fail-on:
        description: 'Failure threshold: new | high | medium | low | never'
        default: 'new'

permissions:
  contents: read
  security-events: write

concurrency:
  group: proto-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Config: committed into the repo (private mode) or passed via secret.
      - name: Config
        env:
          NW_CONFIG: ${{ secrets.NW_CONFIG }}
        run: |
          if [ -f config.json ]; then
            echo "config from the repository"
          elif [ -n "$NW_CONFIG" ]; then
            printf '%s' "$NW_CONFIG" > config.json
            echo "config from the NW_CONFIG secret"
          else
            echo "::error::Neither config.json in the repo nor the NW_CONFIG secret"
            exit 1
          fi
          python3 -c "import json;json.load(open('config.json'))"

      - name: DS snapshot present?
        run: |
          if [ ! -f snapshots/ds-latest.json ]; then
            echo "::error::No snapshots/ds-latest.json — an agent with Figma MCP takes it and commits it"
            exit 1
          fi
          python3 -c "
          import json, datetime
          d = json.load(open('snapshots/ds-latest.json'))
          print('snapshot from', d.get('generatedAt','?')[:10],
                '· variables', len(d.get('variables',{})),
                '· components', len(d.get('components',[])))"

      - name: Compare
        id: diff
        continue-on-error: true
        run: |
          python3 bin/nw.py --fail-on "${{ inputs.fail-on || 'new' }}" --sarif nw.sarif

      # Without Advanced Security the upload fails in private repos — do not fail the run
      - name: Findings to code scanning (needs Advanced Security)
        if: always() && hashFiles('nw.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: nw.sarif
          category: prototypes

      - name: Summary
        if: always()
        run: |
          {
            echo "## Mockups vs design system"
            echo
            sed -n '1,40p' reports/REPORT.md
            echo
            echo "<details><summary>Full report</summary>"
            echo
            cat reports/REPORT.md
            echo
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototypes-report
          path: |
            reports/
            snapshots/findings.json
          retention-days: 30

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.diff.outcome }}" = "failure" ]; then
            echo "::error::New design-system drift — details in the run summary"
            exit 1
          fi
          echo "No new drift"
